<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Narly Properties</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<script>/* apply the saved theme before the page draws (no flash) */try{var t=localStorage.getItem('narly-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{--bg:#fafafa;--panel:#fff;--text:#0a0a0a;--muted:#6b6b6b;--line:#ebebeb;--line2:#d9d9d9;--hover:#f4f4f4;--ink:#0a0a0a;--onink:#fff;
--ok:#15803d;--okbg:#ecfdf3;--warn:#a15c07;--warnbg:#fff7e6;--bad:#c0262d;--badbg:#fdeeee;--info:#262626;--infobg:#f2f2f2;--r:14px;--rs:10px;color-scheme:light}
:root[data-theme="dark"]{--bg:#0a0a0a;--panel:#141414;--text:#f5f5f5;--muted:#9a9a9a;--line:#262626;--line2:#333;--hover:#1c1c1c;--ink:#f5f5f5;--onink:#0a0a0a;
--ok:#4ade80;--okbg:#0f2a1a;--warn:#fbbf24;--warnbg:#2b2210;--bad:#f87171;--badbg:#2e1313;--info:#e5e5e5;--infobg:#222;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--panel:#141414;--text:#f5f5f5;--muted:#9a9a9a;--line:#262626;--line2:#333;--hover:#1c1c1c;--ink:#f5f5f5;--onink:#0a0a0a;
--ok:#4ade80;--okbg:#0f2a1a;--warn:#fbbf24;--warnbg:#2b2210;--bad:#f87171;--badbg:#2e1313;--info:#e5e5e5;--infobg:#222;color-scheme:dark}}
#themeBtn{padding:7px 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.login-theme{position:fixed;top:16px;right:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
a{color:var(--text);text-underline-offset:3px}
h2,h3,h4{letter-spacing:-.02em}
.ic{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;height:60px;padding:0 20px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);white-space:nowrap}
.brand img{width:30px;height:30px;border-radius:8px}
.brand span{font-size:17px;letter-spacing:-.03em}
.brand b{font-weight:700}
.brand i{font-style:normal;font-weight:400;color:var(--muted)}
.search{margin-left:auto;position:relative;max-width:320px;width:100%}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;width:16px;height:16px}
.search input{width:100%;padding:8px 12px 8px 34px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px;outline:none;transition:border-color .15s,background .15s}
.search input:focus{border-color:var(--ink);background:var(--panel)}
#menuBtn{display:none;border:0;background:none;padding:6px;color:var(--text)}
#menuBtn .ic{width:22px;height:22px}
/* layout */
.layout{display:flex;min-height:calc(100vh - 60px)}
nav{width:232px;flex-shrink:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;background:var(--panel);border-right:1px solid var(--line);padding:14px 12px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
nav a{display:flex;align-items:center;gap:11px;padding:8px 12px;margin:1px 0;color:var(--muted);text-decoration:none;border-radius:var(--rs);font-size:14px;font-weight:500;transition:background .12s,color .12s}
nav a:hover{background:var(--hover);color:var(--text)}
nav a.on{background:var(--ink);color:var(--onink)}
nav .grp{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:16px 12px 6px;opacity:.8}
main{flex:1;padding:28px 32px 60px;max-width:1240px;min-width:0}
.phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.phead h2{margin:0;font-size:28px;font-weight:700;margin-right:auto;display:flex;align-items:center;gap:10px;letter-spacing:-.035em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.chead h3,.card>h3{margin:0;font-size:16px;font-weight:650;margin-right:auto}
.count{font-size:13px;color:var(--muted);font-weight:400}
.muted{color:var(--muted)} .small{font-size:13px}
/* buttons */
button,.btn{font:inherit;font-size:14px;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s,transform .05s;white-space:nowrap}
button:hover,.btn:hover{background:var(--hover);border-color:var(--ink)}
button:active,.btn:active{transform:scale(.98)}
button.primary,.btn.primary{background:var(--ink);color:var(--onink);border-color:var(--ink)}
button.primary:hover,.btn.primary:hover{opacity:.85;background:var(--ink)}
button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
button.danger:hover{background:var(--badbg);border-color:var(--bad)}
button.sm{padding:4px 11px;font-size:13px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-decoration:none;color:var(--text);transition:border-color .15s,transform .15s}
.stat:hover{border-color:var(--ink)}
.stat span{display:block;color:var(--muted);font-size:13px;font-weight:500}
.stat b{display:block;font-size:28px;font-weight:700;letter-spacing:-.04em;margin-top:2px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 10px}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr[data-open]{cursor:pointer}
.tbl tr[data-open]:hover td{background:var(--hover)}
.tbl .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
/* badges */
.b{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.b-ok{background:var(--okbg);color:var(--ok)} .b-warn{background:var(--warnbg);color:var(--warn)}
.b-bad{background:var(--badbg);color:var(--bad)} .b-info{background:var(--infobg);color:var(--info)}
.b-muted{background:var(--infobg);color:var(--muted)}
/* alerts */
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.alerts li .b{min-width:64px;justify-content:center}
.alerts li:last-child{border:0}
.alerts a{text-decoration:none;color:var(--text)}
.alerts a:hover{text-decoration:underline}
.empty{color:var(--muted);margin:6px 0;font-size:14px}
.filter{width:100%;max-width:340px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--text);font:inherit;font-size:14px;margin-bottom:12px;outline:none}
.filter:focus{border-color:var(--ink)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix a{text-decoration:none}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 24px}
.kv div span{display:block;font-size:12px;color:var(--muted);margin-bottom:1px}
.kv div{word-break:break-word;font-size:14px;font-weight:500}
.notice{padding:12px 16px;border-radius:var(--rs);background:var(--infobg);color:var(--text);margin-bottom:18px;font-size:14px;border:1px solid var(--line)}
.notice.warn{background:var(--warnbg);border-color:transparent} .notice.bad{background:var(--badbg);border-color:transparent}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .3s}
.checklist{list-style:none;padding:0;margin:0}
.checklist li{display:grid;grid-template-columns:26px 1fr 150px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.checklist li:last-child{border:0}
.checklist li.done .lbl{color:var(--muted);text-decoration:line-through}
.checklist input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink)}
.checklist input[type=date]{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font:inherit;font-size:13px}
.checklist small{display:block;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs a{padding:6px 14px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--text);background:var(--panel);font-size:14px;font-weight:500}
.tabs a.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
details summary{cursor:pointer;margin-top:12px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto}
.hidden{display:none!important}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:100%;max-width:760px;padding:24px 26px;box-shadow:0 24px 80px rgba(0,0,0,.25)}
.mhead{display:flex;align-items:center;margin-bottom:16px}
.mhead h2{margin:0;font-size:21px;font-weight:700;margin-right:auto}
.x{border:0;font-size:24px;background:none;line-height:1;padding:4px 8px;color:var(--muted)}
.x:hover{background:var(--hover);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px}
.field>span{font-weight:500;color:var(--text)}
.field.wide,.fsec{grid-column:1/-1}
.field input,.field select,.field textarea{font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line2);border-radius:var(--rs);background:var(--panel);color:var(--text);width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
.field input[readonly]{background:var(--bg);color:var(--muted)}
.field small{color:var(--muted);font-size:12px}
.field.chk{flex-direction:row;align-items:center;gap:10px}
.field.chk input{width:18px;height:18px;accent-color:var(--ink)}
.fsec{margin:14px 0 0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.checks{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}
.checks label{display:flex;gap:7px;align-items:center;font-weight:400;font-size:14px;border:1px solid var(--line2);border-radius:999px;padding:5px 12px;cursor:pointer}
.checks input{accent-color:var(--ink)}
.attach{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.attach h3{font-size:14px;font-weight:600;margin:0 0 8px}
.attach input[type=file]{font:inherit;font-size:13px;color:var(--muted)}
.files{list-style:none;padding:0;margin:0 0 8px}
.files li{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line)}
.files li:last-child{border:0}
.files li span{margin-right:auto;word-break:break-all;display:flex;gap:8px;align-items:center}
.mfoot{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.mfoot .sp{flex:1}
#lockBtn{padding:7px 12px}
body.locked .topbar,body.locked .layout{display:none}
#login:empty{display:none}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:36px 32px;width:100%;max-width:390px;display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.06)}
.login-card img{margin:0 auto;border-radius:14px}
.login-card .field{text-align:left}
.login-card h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.03em}
.login-card button.primary{justify-content:center;padding:11px}
.err{color:var(--bad);min-height:1em;margin:0;font-size:14px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,8px);background:var(--ink);color:var(--onink);padding:10px 20px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
.guide h3{margin:22px 0 6px;font-size:17px}
.guide li{margin:5px 0;font-size:14px}
.welcome{text-align:center;padding:48px 24px}
.welcome img{width:72px;height:72px;border-radius:18px}
.welcome h2{font-size:30px;font-weight:700;letter-spacing:-.04em;margin:18px 0 6px}
.welcome ol{text-align:left;max-width:460px;margin:22px auto;padding-left:22px;line-height:1.9}
@media (max-width:860px){
 #menuBtn{display:inline-flex}
 .topbar{padding:0 12px;gap:8px}
 .brand span{display:none}
 nav{position:fixed;top:60px;bottom:0;left:0;height:auto;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.12)}
 nav.open{transform:none}
 main{padding:18px 14px 60px}
 .phead h2{font-size:24px;width:100%}
 .cols2,.grid{grid-template-columns:minmax(0,1fr)}
 .tbl thead{display:none}
 .tbl tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}
 .tbl tbody tr:last-child{border:0}
 .tbl td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 4px;text-align:right}
 .tbl td::before{content:attr(data-label);font-weight:500;color:var(--muted);text-align:left}
 .checklist li{grid-template-columns:26px 1fr}
 .checklist li input[type=date]{grid-column:2}
 .mbox{padding:20px 18px;border-radius:18px}
 #lockBtn span{display:none}
}
@media print{.topbar,nav,button,.filter,.tabs{display:none!important}main{padding:0}.card{break-inside:avoid;border-color:#ccc}}
</style>
</head>
<body>
<header class="topbar">
  <button id="menuBtn" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="brand" href="#/dashboard"><img src="icon.svg" alt=""><span><b>Narly</b> <i>Properties</i></span></a>
  <label class="search"><svg class="ic" viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/></svg><input id="globalSearch" type="search" placeholder="Search everything" aria-label="Search"></label>
  <button id="themeBtn" data-act="theme" aria-label="Change theme"></button>
  <button id="lockBtn" class="hidden" title="Lock now"><svg class="ic" viewBox="0 0 24 24"><path d="M6 11h12v10H6zM8.5 11V7.5a3.5 3.5 0 0 1 7 0V11"/></svg><span>Lock</span></button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><p class="muted">Loading…</p></main>
</div>
<div id="login"></div>
<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= Helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const todayStr = () => iso(new Date());
const parseD = s => new Date(String(s).slice(0, 10) + 'T00:00:00');
function addMonths(s, m) { const d = parseD(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + m); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return iso(d); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); }
const daysTo = s => Math.round((parseD(s) - parseD(todayStr())) / 86400000);
const fmtDate = s => s ? parseD(s).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
const fmtDT = s => s ? new Date(s).toLocaleString('en-GB', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
const money = n => '£' + (Number(n) || 0).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
const badge = (t, k = 'muted') => `<span class="b b-${k}">${esc(t)}</span>`;
const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200); }
function download(name, content, type) { const b = content instanceof Blob ? content : new Blob([content], {type}); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 5000); }
const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.ceil(n / 1024) + ' KB';

const ICONS = {
  dashboard:'M4 4h7v8H4zM13 4h7v5h-7zM13 11h7v9h-7zM4 14h7v6H4z',
  properties:'M3 11 12 4l9 7M5.5 9.5V20h13V9.5M10 20v-5h4v5',
  compliance:'M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6zM9 12l2 2 4-4',
  utilities:'M13 3 5 14h6l-1 7 8-11h-6z',
  viewings:'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  tenants:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6',
  tenancies:'M14 3H6v18h12V7zM14 3v4h4M9 13h6M9 17h6',
  inspections:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4',
  maintenance:'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z',
  money:'M4 7h15a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM4 7l12-3v3M16 13.5h1',
  tasks:'M4 4h16v16H4zM8 12l3 3 5-6',
  contacts:'M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 20v-1a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',
  documents:'M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z',
  guide:'M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z',
  settings:'M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1M15 5v4M9 10v4M17 15v4',

/* ================= Storage (IndexedDB, all on this device) ================= */
const DB = {
  db:null, data:{},

    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('files'); };
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  req(store, mode, fn) { return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const q = fn(t.objectStore(store));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  get(store, k) { return this.req(store, 'readonly', s => s.get(k)); },
  put(store, k, v) { return this.req(store, 'readwrite', s => s.put(v, k)); },
  del(store, k) { return this.req(store, 'readwrite', s => s.delete(k)); },
  clear(store) { return this.req(store, 'readwrite', s => s.clear()); },
  key:null, // AES key derived from the login password (only ever held in memory)

  async kput(k, val) { return this.put('kv', k, this.key ? {__enc:1, ...(await Crypt.enc(this.key, new TextEncoder().encode(JSON.stringify(val))))} : val); },
  async fget(id) { const v = await this.get('files', id); return v && v.__enc ? new Blob([await Crypt.dec(this.key, v)], {type:v.type}) : v; },
  async fput(id, blob) { return this.put('files', id, this.key ? {__enc:1, type:blob.type, ...(await Crypt.enc(this.key, await blob.arrayBuffer()))} : blob); },
  async load() { for (const e of ENTITIES) this.data[e] = (await this.kget(e)) || [];

  save(k) { return this.kput(k, this.data[k]); },
  // Re-write every record and file under a new key (null = unencrypted)
  async rekey(newKey) {
    const blobs = []; for (const m of this.data.filesIndex) blobs.push([m.id, await this.fget(m.id)]);
    this.key = newKey;
    for (const k of [...ENTITIES, 'filesIndex', 'settings']) await this.save(k);
    for (const [id, b] of blobs) if (b) await this.fput(id, b);
  },
};

const Crypt = {

  async derive(pw, salt, iter) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
  },
  async enc(key, buf) { const iv = crypto.getRandomValues(new Uint8Array(12)); return {iv, ct: await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, buf)}; },
  dec(key, o) { if (!key) throw new Error('locked'); return crypto.subtle.decrypt({name:'AES-GCM', iv:o.iv}, key, o.ct); },
};

}
async function tryPassword(auth, pw) {

}

const all = e => DB.data[e] || [];
const byId = (e, id) => all(e).find(r => r.id === id);
const titleOf = (e, id) => { const r = byId(e, id); return r ? SCHEMAS[e].title(r) : ''; };

  const i = DB.data[e].findIndex(r => r.id === rec.id);

}

/* ================= Domain logic ================= */

  for (const i of all('inspections').filter(i => i.damp && daysTo(i.date) > -90)) add('warn', `Damp/mould reported at ${propName(i.property)} on ${fmtDate(i.date)} – investigate promptly`, '#/inspections');

  const anyData = ENTITIES.some(e => all(e).length);
  const lb = DB.data.settings.lastBackup;
  if (anyData && (!lb || daysTo(lb) < -30)) add('info', lb ? `Last backup was ${fmtDate(lb)} – make a new one` : 'You have never made a backup – do it now', '#/settings');
  const order = {bad:0, warn:1, info:2};
  return A.sort((a, b) => order[a.k] - order[b.k] || (a.date || '9').localeCompare(b.date || '9'));
}
function checklistProgress(t, key, list) {
  const st = t[key] || {}; const done = list.filter(([k, , , auto]) => (st[k] && st[k].done) || (auto && auto(t))).length;
  return {done, total:list.length};
}

/* ================= Rendering: tables & forms ================= */
function colLabel(S, c) { if (typeof c === 'object') return c.l; const f = S.fields.find(x => x.k === c); return f ? f.l : c; }
function fmtVal(f, v) {
  if (v === undefined || v === null || v === '') return '';
  if (!f) return esc(v);
  if (f.t === 'date') return esc(fmtDate(v));
  if (f.t === 'datetime-local') return esc(fmtDT(v));
  if (f.t === 'money') return money(v);
  if (f.t === 'checkbox') return v ? 'Yes' : 'No';
  if (f.t === 'ref') return esc(titleOf(f.to, v));
  if (f.t === 'refs') return esc((v || []).map(id => titleOf(f.to, id)).join(', '));
  if (f.t === 'select' && f.opts && typeof f.opts[0] === 'object') { const o = f.opts.find(o => o.v === v); return esc(o ? o.l : v); }
  return esc(v);
}
function cell(S, c, r) { if (typeof c === 'object') return c.v(r); return fmtVal(S.fields.find(x => x.k === c), r[c]); }
function table(entity, rows, cols, empty) {
  const S = SCHEMAS[entity]; cols = cols || S.cols;
  if (!rows.length) return `<p class="empty">${esc(empty || 'Nothing recorded yet.')}</p>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c => `<th>${esc(colLabel(S, c))}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r => `<tr data-open="${entity}:${r.id}">${cols.map(c => `<td data-label="${esc(colLabel(S, c))}">${cell(S, c, r) || '&nbsp;'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const colsWithout = (entity, key) => SCHEMAS[entity].cols.filter(c => c !== key && !(typeof c === 'object' && c.l.toLowerCase() === key));
function normOpts(f) { const o = typeof f.opts === 'function' ? f.opts() : f.opts; return o.map(x => typeof x === 'string' ? {v:x, l:x} : x); }
function renderFields(entity, rec) {
  return SCHEMAS[entity].fields.map(f => {
    if (f.t === 'section') return `<h3 class="fsec">${esc(f.l)}</h3>`;
    let v = rec[f.k]; if (v === undefined && !rec.id) v = typeof f.def === 'function' ? f.def() : f.def;
    const n = `name="${f.k}"`, rq = f.req ? ' required' : '', ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
    const hint = f.hint ? `<small>${esc(f.hint)}</small>` : '';
    const lab = `<span>${esc(f.l)}${f.req ? ' *' : ''}</span>`;
    let input;
    switch (f.t) {
      case 'checkbox': return `<label class="field chk"><input type="checkbox" ${n}${v ? ' checked' : ''}>${lab}</label>`;
      case 'refs': {
        const opts = all(f.to).slice().sort((a, b) => SCHEMAS[f.to].title(a).localeCompare(SCHEMAS[f.to].title(b)));
        const sel = v || [];
        return `<div class="field wide">${lab}<div class="checks">${opts.length ? opts.map(o => `<label><input type="checkbox" name="${f.k}" value="${o.id}"${sel.includes(o.id) ? ' checked' : ''}> ${esc(SCHEMAS[f.to].title(o))}</label>`).join('') : `<span class="muted">None yet – add them on the ${esc(SCHEMAS[f.to].label)} page first.</span>`}</div>${hint}</div>`;
      }
      case 'textarea': input = `<textarea ${n} rows="3"${rq}${ph}>${esc(v)}</textarea>`; break;
      case 'select': {
        const opts = normOpts(f);
        input = `<select ${n}${rq}><option value="">— choose —</option>${opts.map(o => `<option value="${esc(o.v)}"${o.v === v ? ' selected' : ''}>${esc(o.l)}</option>`).join('')}${v && !opts.some(o => o.v === v) ? `<option selected value="${esc(v)}">${esc(v)}</option>` : ''}</select>`; break;
      }
      case 'ref': {
        const opts = all(f.to).slice().sort((a, b) => SCHEMAS[f.to].title(a).localeCompare(SCHEMAS[f.to].title(b)));
        input = `<select ${n}${rq}><option value="">— choose —</option>${opts.map(o => `<option value="${o.id}"${o.id === v ? ' selected' : ''}>${esc(SCHEMAS[f.to].title(o))}</option>`).join('')}</select>`; break;
      }
      case 'money': input = `<input type="number" step="0.01" min="0" inputmode="decimal" ${n} value="${esc(v)}"${rq}${ph}>`; break;
      default: input = `<input type="${f.t}" ${n} value="${esc(v)}"${rq}${ph}>`;
    }
    return `<label class="field${f.wide || f.t === 'textarea' ? ' wide' : ''}">${lab}${input}${hint}</label>`;
  }).join('');
}
function readForm(entity, form, rec) {
  for (const f of SCHEMAS[entity].fields) {
    if (f.t === 'section') continue;
    if (f.t === 'refs') { rec[f.k] = $$(`input[name="${f.k}"]:checked`, form).map(i => i.value); continue; }
    const el = form.elements[f.k]; if (!el) continue;
    if (f.t === 'checkbox') rec[f.k] = el.checked;
    else if (f.t === 'money' || f.t === 'number') rec[f.k] = el.value === '' ? '' : Number(el.value);
    else rec[f.k] = el.value.trim();
  }
  return rec;
}
function filesListHTML(owner) {
  const fs = filesFor(owner);
  return fs.length ? `<ul class="files">${fs.map(f => `<li><span>${ico('clip')}${esc(f.name)} <small class="muted">${fmtSize(f.size)} · ${esc(fmtDate(f.added))}</small></span><button type="button" class="sm" data-act="openFile" data-id="${f.id}">Open</button><button type="button" class="sm danger" data-act="delFile" data-id="${f.id}">Remove</button></li>`).join('')}</ul>` : '';
}
function showModal(html) { $('#mbox').innerHTML = html; $('#modal').classList.remove('hidden'); document.body.style.overflow = 'hidden'; const f = $('#mbox input:not([type=hidden]),#mbox select,#mbox textarea'); if (f && innerWidth > 860) f.focus(); }
function closeModal() { $('#modal').classList.add('hidden'); $('#mbox').innerHTML = ''; document.body.style.overflow = ''; }
let pendingFiles = [];
function openForm(entity, rec = {}, opts = {}) {
  const S = SCHEMAS[entity], r = JSON.parse(JSON.stringify(rec)), isNew = !r.id;
  pendingFiles = [];
  const owner = entity + ':' + r.id;
  const actions = (S.formActions || []).map((a, i) => a.show(r) ? `<button type="button" id="fa${i}">${esc(a.l)}</button>` : '').join('');
  showModal(`<form id="recForm"><div class="mhead"><h2>${isNew ? 'Add' : 'Edit'} ${esc(S.one.toLowerCase())}</h2><button type="button" class="x" data-act="closeModal" aria-label="Close">×</button></div>
    ${S.intro && isNew ? `<p class="notice">${esc(S.intro)}</p>` : ''}
    <div class="grid">${renderFields(entity, r)}</div>
    <div class="attach"><h3>Attachments (certificates, photos, signed agreements, receipts…)</h3>
      <div id="attList">${isNew ? '' : filesListHTML(owner)}</div>
      <input type="file" id="attInput" multiple><div id="attPending" class="small muted"></div></div>
    <div class="mfoot">${isNew ? '' : '<button type="button" class="danger" id="delBtn">Delete</button>'}${actions}<span class="sp"></span>
      <button type="button" data-act="closeModal">Cancel</button><button type="submit" class="primary">Save</button></div></form>`);
  const form = $('#recForm');
  form.addEventListener('change', e => { if (S.onChange) S.onChange(form, e.target.name); });
  $('#attInput').onchange = e => { pendingFiles.push(...e.target.files); $('#attPending').textContent = 'Will be attached on save: ' + pendingFiles.map(f => f.name).join(', '); e.target.value = ''; };
  (S.formActions || []).forEach((a, i) => { const b = $('#fa' + i); if (b) b.onclick = () => a.run(readForm(entity, form, r)); });
  form.onsubmit = async e => {
    e.preventDefault(); if (!form.reportValidity()) return;
    readForm(entity, form, r);
    const saved = await upsert(entity, r);
    for (const f of pendingFiles) await addFile(entity + ':' + saved.id, f);
    pendingFiles = []; closeModal(); toast('Saved');
    if (opts.after) opts.after(saved); else route();
  };
  if (!isNew) $('#delBtn').onclick = async () => {
    const refs = referencesTo(entity, r.id);
    if (refs.length) return alert(`This ${S.one.toLowerCase()} is still used by: ${refs.join(', ')}.\nDelete or change those first.`);
    if (!confirm(`Delete this ${S.one.toLowerCase()} and its attachments? This cannot be undone.`)) return;
    await removeRec(entity, r.id); closeModal(); toast('Deleted');
    if (S.detail && location.hash.includes(r.id)) location.hash = '#/' + entity; else route();
  };
}

const blobToB64 = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.readAsDataURL(b); });

async function backup() {

  const exported = new Date().toISOString();
  let out = JSON.stringify({app:'landlord-desk', version:1, exported, settings:DB.data.settings, data, files});
  const auth = await DB.get('kv', 'auth');
  if (DB.key && auth && auth.enabled) { // login on → backup is encrypted with the same password
    const {iv, ct} = await Crypt.enc(DB.key, new TextEncoder().encode(out));
    out = JSON.stringify({app:'landlord-desk', version:1, exported, encrypted:true, salt:u8ToB64(auth.salt), iter:auth.iter, iv:u8ToB64(iv), ct:u8ToB64(ct)});
  }

async function restore(file) {
  let j; try { j = JSON.parse(await file.text()); } catch { return alert('That file is not a valid backup.'); }
  if (j.app !== 'landlord-desk' || !(j.data || j.encrypted)) return alert('That file is not a Narly Properties backup.');
  if (j.encrypted) {
    const pw = await askPassword('Password-protected backup', 'Enter the password that was in use when this backup was made.'); if (pw == null) return;
    try { const key = await Crypt.derive(pw, b64ToU8(j.salt), j.iter);
      const exp = j.exported; j = JSON.parse(new TextDecoder().decode(await Crypt.dec(key, {iv:b64ToU8(j.iv), ct:b64ToU8(j.ct)}))); j.exported = j.exported || exp;
    } catch { return alert('Wrong password – the backup could not be opened.'); }
  }
  if (!confirm(`Restore backup from ${new Date(j.exported).toLocaleString('en-GB')}?\nThis REPLACES everything currently in the app on this device.`)) return;
  await DB.clear('files');
  for (const e of ENTITIES) { DB.data[e] = j.data[e] || []; await DB.save(e); }
  DB.data.filesIndex = [];
  for (const f of j.files || []) { const {data, ...meta} = f; await DB.fput(meta.id, b64ToBlob(data, meta.type)); DB.data.filesIndex.push(meta); }
  await DB.save('filesIndex');
  DB.data.settings = {...(j.settings || {}), lastBackup: (j.settings || {}).lastBackup}; await DB.save('settings');

}

  download('narly-properties-reminders.ics', ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Narly Properties//EN', 'CALSCALE:GREGORIAN', ...body, 'END:VCALENDAR'].join('\r\n'), 'text/calendar');
  toast(`${ev.length} reminders exported`);
}

/* ================= Theme (Automatic / Light / Dark) ================= */
const THEMES = {auto:['auto', 'Automatic (follows your device)'], light:['sun', 'Light'], dark:['moon', 'Dark']};
const getTheme = () => { try { return localStorage.getItem('narly-theme') || 'auto'; } catch { return 'auto'; } };
function applyTheme(t) {
  try { if (t === 'auto') localStorage.removeItem('narly-theme'); else localStorage.setItem('narly-theme', t); } catch {}
  if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $$('meta[name=theme-color]').forEach(m => { m.removeAttribute('media'); m.content = dark ? '#0a0a0a' : '#ffffff'; });
  $$('[data-act=theme]').forEach(b => { const [ic, l] = THEMES[t]; b.innerHTML = ico(ic) + '<span class="sr">' + l + '</span>'; b.title = 'Theme: ' + l + ' (click to change)'; });
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(getTheme()));

/* ================= Events ================= */
const ACTIONS = {
  closeModal, print: () => print(),
  theme: () => { const order = ['auto', 'light', 'dark'], next = order[(order.indexOf(getTheme()) + 1) % 3]; applyTheme(next); toast('Theme: ' + THEMES[next][1]); }, backup, ics: exportICS, demo: loadDemo,
  csv: el => exportCSV(el.dataset.e), csvYear: el => exportYearCSV(+el.dataset.y),
  edit: el => openForm(el.dataset.e, byId(el.dataset.e, el.dataset.id)),
  openFile: el => openFile(el.dataset.id),
  delFile: async el => { if (!confirm('Remove this attachment?')) return; await deleteFile(el.dataset.id); const li = el.closest('li'); if (li && $('#modal:not(.hidden)')) li.remove(); else route(); },
  setStatus: async el => { const t = byId('tenancies', el.dataset.id); const r = {...t, status:el.dataset.s};
    if (el.dataset.s === 'Notice given') { openForm('tenancies', r); setTimeout(() => { const f = $('#recForm [name=noticeBy]'); if (f) f.scrollIntoView({block:'center'}); }, 50); return; }
    if (el.dataset.s === 'Ended' && !r.endDate) r.endDate = r.noticeExpiry || todayStr();
    await upsert('tenancies', r); toast('Status: ' + r.status); route(); },
  wipe: async () => { if (!confirm('Delete ALL properties, tenants, documents and settings on this device?')) return; if (prompt('Type DELETE to confirm') !== 'DELETE') return;
    for (const e of ENTITIES) { DB.data[e] = []; await DB.save(e); } await DB.clear('files'); DB.data.filesIndex = []; await DB.save('filesIndex'); toast('All data deleted'); location.hash = '#/dashboard'; route(); },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-add],[data-open]'); if (!t) return;
  if (t.dataset.act) { e.preventDefault(); ACTIONS[t.dataset.act] && ACTIONS[t.dataset.act](t, e); return; }
  if (t.dataset.add) { e.preventDefault(); openForm(t.dataset.add, t.dataset.pre ? JSON.parse(t.dataset.pre) : {}); return; }
  if (t.dataset.open) { e.preventDefault(); const [en, id] = t.dataset.open.split(':'); const S = SCHEMAS[en];
    if (S.detail) location.hash = `#/${S.detail}/${id}`; else { const r = byId(en, id); if (r) openForm(en, r); } }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.ck || el.dataset.ckd) {
    const [id, key, k] = (el.dataset.ck || el.dataset.ckd).split('|'); const t = byId('tenancies', id); t[key] = t[key] || {}; const s = t[key][k] = t[key][k] || {};
    if (el.dataset.ck) { s.done = el.checked; if (el.checked && !s.date) s.date = todayStr(); } else { s.date = el.value; if (el.value) s.done = true; }
    await upsert('tenancies', t); route(); return;
  }
  if (el.dataset.actChange === 'restore' && el.files[0]) { await restore(el.files[0]); el.value = ''; }
  if (el.dataset.actChange === 'uploadGeneral') { for (const f of el.files) await addFile('general', f); toast('Uploaded'); route(); }
});
document.addEventListener('input', e => {
  if (e.target.matches('[data-filter]')) { const q = e.target.value.toLowerCase(); const tb = e.target.parentElement.querySelector('tbody'); if (tb) $$('tr', tb).forEach(tr => tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none'); }
});
document.addEventListener('submit', async e => {
  if (/^auth/.test(e.target.id)) { e.preventDefault(); if (e.target.reportValidity()) await handleAuthForm(e.target); return; }
  if (e.target.id === 'setForm') { e.preventDefault(); const f = e.target; DB.data.settings.landlordName = f.landlordName.value.trim(); DB.data.settings.warnDays = +f.warnDays.value || 60; await DB.save('settings'); toast('Settings saved'); route(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal(); });
$('#menuBtn').onclick = () => $('#nav').classList.toggle('open');
$('#globalSearch').addEventListener('keydown', e => { if (e.key === 'Enter') location.hash = '#/search/' + encodeURIComponent(e.target.value); });
window.addEventListener('hashchange', route);

$('#lockBtn').onclick = lockNow;
applyTheme(getTheme());
function startApp() { route(); startAutoLock(); }
(async function init() {
  let auth;
  try { await DB.open(); auth = await DB.get('kv', 'auth'); if (!(auth && auth.enabled)) await DB.load(); }
  catch (err) { $('#main').innerHTML = `<div class="notice bad">This browser blocked local storage (${esc(err.message || err)}). Try another browser, or turn off private browsing.</div>`; return; }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (auth && auth.enabled) { if (!Crypt.ok()) { document.body.innerHTML = '<p style="padding:20px">This browser cannot open password-protected data. Use an up-to-date Chrome, Edge, Firefox or Safari.</p>'; return; } showLogin(auth); }
  else startApp();
})();
</script>
